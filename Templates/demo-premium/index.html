        document.addEventListener('contextmenu', e => e.preventDefault());

        let rawBranding = {}, rawMenuEn = [], rawMenuAr = [];

        const translations = {

            ar: { langToggle: 'English', search: 'البحث في القائمة...', all: 'الكل', addToCart: 'أضف للسلة', myOrder: 'طلبي', subtotal: 'المجموع الفرعي', vat: 'ضريبة القيمة المضافة (15%)', total: 'المجموع الإجمالي', orderType: 'نوع الطلب', delivery: 'توصيل للمنزل', pickup: 'استلام من الفرع', checkout: 'أرسل الطلب عبر واتساب', todaySpecial: "🌟 أطباق اليوم المميزة", noItems: "لا توجد عناصر.", freqBought: "غالباً ما تشترى معاً", reviews: "تقييمات العملاء" }

        async function init() {
            try {
                const fileUrl = "MenuMasterData.json?v=" + new Date().getTime();
                const response = await fetch(fileUrl);
                const jsonData = await response.json();
                
                const sNames = Object.keys(jsonData);
                const sBrand = sNames.find(n => n.includes("01") || n.includes("Brand")) || sNames[0];

                if(jsonData[sBrand]) rawBranding = jsonData[sBrand].find((r, i) => i > 0 && (r.K || r.B || r.L)) || jsonData[sBrand][1] || {};

        function formatMenuData(rawSource) {
            activeMenuData = []; mainCategories = []; allSubCategories = [];
            const brandLogo = rawBranding.N || rawBranding.M || 'logo.png';
            
            rawSource.forEach(row => {
                if(!row.B || !row.D) return;
                const safeId = row.A ? String(row.A).trim() : Math.random().toString();
                
                let urls = [];
                if (row.K) { urls = String(row.K).split(',').map(u => { let clean = u.trim(); if (!clean) return null; if (!clean.startsWith('http')) return `https://raw.githubusercontent.com/Rmoosa2014/Restaurant-menu/main/images/ItemImages/${clean}`; return clean; }).filter(u => u !== null); } else { urls.push(brandLogo); }
                
                const item = {

                    name: String(row.D).trim(), order: parseInt(row.E) || 999, price: row.F || 0,
                    desc: row.G || "", related: row.H || "", review: row.I || "",
                    isTodaySpecial: String(row.J || "").trim().toLowerCase() === 'today special', bannerUrl: row.L || "",
                    imgUrls: [...new Set(urls)], img: urls[0]
                };
                activeMenuData.push(item);

            renderCategoryFilters(); renderSubCategoryFilters(); executeFilter();

                const isAll = cat === 'All', isActive = isAll ? selectedMainCategories.size === 0 : selectedMainCategories.has(cat);
                const btn = document.createElement('button');
                btn.className = `w-[100px] shrink-0 snap-start p-2 rounded-xl border font-bold text-[10px] transition-colors ${isActive ? 'bg-red-500 text-white' : 'bg-white text-gray-600'}`;
                btn.textContent = isAll ? translations[currentLang].all : cat;
                btn.onclick = () => { if (isAll) { selectedMainCategories.clear(); selectedSubCategories.clear(); } else { selectedMainCategories.has(cat) ? selectedMainCategories.delete(cat) : selectedMainCategories.add(cat); } renderCategoryFilters(); renderSubCategoryFilters(); executeFilter(); };
                (index % 8 < 4) ? row1.appendChild(btn) : row2.appendChild(btn);
            });
        }

        function renderSubCategoryFilters() {
            const container = document.getElementById('sub-category-filters');
            container.innerHTML = '';
            let relevant = new Set();
            if (selectedMainCategories.size === 0) allSubCategories.forEach(sub => relevant.add(sub));
            else activeMenuData.forEach(i => { if (selectedMainCategories.has(i.mainCat)) relevant.add(i.subCat); });

            Array.from(relevant).sort().forEach(subCat => {
                const isActive = selectedSubCategories.has(subCat);
                const btn = document.createElement('button');
                btn.className = `shrink-0 px-3 py-1 rounded-full border text-xs font-bold ${isActive ? 'bg-gray-800 text-white' : 'bg-white text-gray-600'}`;
                btn.textContent = subCat;
                btn.onclick = () => { selectedSubCategories.has(subCat) ? selectedSubCategories.delete(subCat) : selectedSubCategories.add(subCat); renderSubCategoryFilters(); executeFilter(); };
                container.appendChild(btn);
            });
        }

        function executeFilter() {
            const container = document.getElementById('menu-container'); container.innerHTML = '';
            let filtered = activeMenuData;
            
            if (selectedMainCategories.size > 0) filtered = filtered.filter(i => selectedMainCategories.has(i.mainCat));
            if (selectedSubCategories.size > 0) filtered = filtered.filter(i => selectedSubCategories.has(i.subCat));
            if (searchQuery) filtered = filtered.filter(i => (`${i.name} ${i.desc}`).toLowerCase().includes(searchQuery));

            if (selectedMainCategories.size === 0 && selectedSubCategories.size === 0 && !searchQuery) {
                const specials = activeMenuData.filter(i => i.isTodaySpecial);
                if (specials.length > 0) { specials.sort((a, b) => a.order - b.order); renderSection(translations[currentLang].todaySpecial, specials, container, true); }
            }

            const grouped = {};
            filtered.forEach(item => { if(!grouped[item.subCat]) grouped[item.subCat] = []; grouped[item.subCat].push(item); });

            for (const subCat in grouped) {
                const items = grouped[subCat].sort((a, b) => a.order - b.order);
                renderSection(subCat, items, container, false);
            }
            container.classList.remove('hidden'); container.classList.add('flex');
        }

        function renderSection(title, items, container, isHighlight) {
            const section = document.createElement('div');
            
            const titleWrapper = document.createElement('div');
            titleWrapper.className = "flex items-center justify-between border-b-2 border-red-100 pb-2 mb-4 cursor-pointer hover:opacity-80 transition-opacity group";
            titleWrapper.onclick = () => openCategoryPage(title, isHighlight);
            titleWrapper.innerHTML = `<h3 class="${isHighlight ? 'text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-orange-500' : 'text-xl font-bold text-gray-800'}">${title}</h3><div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-red-500 group-hover:bg-red-100 shadow-sm"><i class="fas ${currentLang === 'ar' ? 'fa-chevron-left' : 'fa-chevron-right'} text-sm"></i></div>`;
            section.appendChild(titleWrapper);

            // CATEGORY BANNER LOGIC ADDED HERE
            const bannerItem = items.find(i => i.bannerUrl && String(i.bannerUrl).trim() !== "");
            if (bannerItem && !isHighlight) {
                let cleanUrl = bannerItem.bannerUrl.trim();
                if (!cleanUrl.startsWith('http')) cleanUrl = `https://raw.githubusercontent.com/Rmoosa2014/Restaurant-menu/main/images/ItemImages/${cleanUrl}`;
                const bannerDiv = document.createElement('div');
                bannerDiv.className = "w-full aspect-[21/9] sm:aspect-[3/1] bg-gray-100 rounded-2xl overflow-hidden mb-4 shadow-sm relative";
                bannerDiv.innerHTML = `<img src="${cleanUrl}" class="w-full h-full object-cover"> <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>`;
                section.appendChild(bannerDiv);
            }
            
            const grid = document.createElement('div');
            if (isHighlight) grid.className = `grid ${items.length > 20 ? 'grid-rows-2' : 'grid-rows-1'} grid-flow-col gap-3 sm:gap-4 overflow-x-auto hide-scrollbar pb-4 snap-x snap-mandatory`;
            else grid.className = "grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-6";

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = `menu-card ${item.isTodaySpecial ? 'bg-amber-50/60 border-amber-200' : 'bg-white border-gray-100'} rounded-2xl overflow-hidden border shadow-sm flex flex-col h-full opacity-0 translate-y-4 relative ${isHighlight ? 'w-[40vw] sm:w-[220px] snap-start shrink-0' : ''}`;
                card.style.animation = `fadeInUp 0.4s ease forwards`;
                card.onclick = () => openModal(item.id);
                
                let badgeHtml = item.isTodaySpecial ? `<div class="absolute top-2 end-2 bg-gradient-to-r from-orange-400 to-red-500 px-2 py-1 rounded-lg text-[10px] font-bold text-white shadow-sm z-10"><i class="fas fa-star text-[10px]"></i></div>` : '';
                
                let imagesHtml = '';
                item.imgUrls.forEach(url => { imagesHtml += `<img src="${url}" class="w-full h-full object-cover shrink-0 snap-center">`; });
                if (item.imgUrls.length > 1) imagesHtml += `<img src="${item.imgUrls[0]}" data-is-clone="true" class="w-full h-full object-cover shrink-0 snap-center">`;

                card.innerHTML = `
                    <div class="relative aspect-[4/3] overflow-hidden shrink-0 bg-gray-100 rounded-t-2xl">
                        <div class="mini-img-slider flex w-full h-full overflow-x-auto snap-x snap-mandatory hide-scrollbar" style="scroll-behavior: smooth;" data-img-count="${item.imgUrls.length}">${imagesHtml}</div>
                        ${badgeHtml}
                    </div>
                    <div class="p-3 sm:p-4 flex flex-col flex-grow">
                        <h4 class="text-sm font-bold text-gray-900 line-clamp-1">${item.name}</h4>
                        <div class="flex justify-between items-center mt-1">
                            <span class="font-extrabold text-red-600">${item.price} ${globalCurrency}</span>
                            <button class="w-7 h-7 rounded-full bg-gray-100 text-red-500 hover:bg-red-500 hover:text-white transition flex items-center justify-center shrink-0" onclick="event.stopPropagation(); quickAddToCart('${item.id}')"><i class="fas fa-plus text-xs"></i></button>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
            section.appendChild(grid); container.appendChild(section);
        }

        function openModal(id) {
            const item = activeMenuData.find(i => i.id === id); if (!item) return;
            currentOpenItemId = id; tempModalQty = 1;
            document.getElementById('modalQtyDisplay').textContent = tempModalQty;
            updateModalPriceDisplay();
            
            const slider = document.getElementById('modal-image-slider'), dots = document.getElementById('modal-image-dots');
            slider.innerHTML = ''; dots.innerHTML = '';
            item.imgUrls.forEach((url, i) => { slider.insertAdjacentHTML('beforeend', `<img src="${url}" class="w-full h-full object-cover shrink-0 snap-center">`); dots.insertAdjacentHTML('beforeend', `<div id="dot-${i}" class="modal-dot w-2 h-2 rounded-full transition-all duration-300 ${i===0 ? 'bg-red-500 scale-125' : 'bg-white/80 shadow-sm'}"></div>`); });
            if (item.imgUrls.length > 1) slider.insertAdjacentHTML('beforeend', `<img src="${item.imgUrls[0]}" data-is-clone="true" class="w-full h-full object-cover shrink-0 snap-center">`);

            document.getElementById('modalCategoryBadge').textContent = item.subCat;
            document.getElementById('modalTitle').textContent = item.name;
            document.getElementById('modalPrice').textContent = `${item.price} ${globalCurrency}`;
            document.getElementById('modalDesc').textContent = item.desc;
            
            // Handle Reviews
            const reviewArea = document.getElementById('modalReviewArea');
            if (item.review && item.review.trim() !== "") {
                document.getElementById('modalReviewContent').innerHTML = `"${item.review}" <span class="text-yellow-400 ms-1"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>`;
                reviewArea.classList.remove('hidden');
            } else { reviewArea.classList.add('hidden'); }

            // Handle Related Items
            const relatedArea = document.getElementById('modalRelatedArea'), relatedGrid = document.getElementById('modalRelatedGrid');
            if (item.related && item.related.trim() !== "") {
                const ids = item.related.split(',').map(s => s.trim());
                const relatedItems = activeMenuData.filter(i => ids.includes(i.id) && i.id !== item.id);
                if (relatedItems.length > 0) {
                    relatedGrid.innerHTML = '';
                    relatedItems.forEach(rItem => {
                        const rCard = document.createElement('div');
                        rCard.className = "shrink-0 w-32 bg-white border border-gray-200 rounded-xl overflow-hidden snap-center cursor-pointer hover:shadow-md transition";
                        rCard.onclick = () => { closeModal(); setTimeout(() => openModal(rItem.id), 300); };
                        rCard.innerHTML = `<img src="${rItem.img}" class="w-full h-20 object-cover bg-gray-100"> <div class="p-2"><div class="text-[10px] font-bold text-gray-800 line-clamp-1">${rItem.name}</div><div class="text-xs font-extrabold text-red-500">${rItem.price}${globalCurrency}</div></div>`;
                        relatedGrid.appendChild(rCard);
                    });
                    relatedArea.classList.remove('hidden');
                } else { relatedArea.classList.add('hidden'); }
            } else { relatedArea.classList.add('hidden'); }
            
            const modal = document.getElementById('productModal'), backdrop = document.getElementById('modalBackdrop'), content = document.getElementById('modalContent');
            modal.classList.remove('hidden'); modal.classList.add('flex'); void modal.offsetWidth;
            backdrop.classList.remove('opacity-0'); backdrop.classList.add('opacity-100');
            content.classList.remove('translate-y-full', 'opacity-0'); content.classList.add('translate-y-0', 'opacity-100');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('productModal'), backdrop = document.getElementById('modalBackdrop'), content = document.getElementById('modalContent');
            backdrop.classList.remove('opacity-100'); backdrop.classList.add('opacity-0');
            content.classList.remove('translate-y-0', 'opacity-100'); content.classList.add('translate-y-full', 'opacity-0');
            document.body.style.overflow = '';
            setTimeout(() => { modal.classList.remove('flex'); modal.classList.add('hidden'); }, 300);
        }

        // CART LOGIC
        function changeModalQty(change) {
            tempModalQty += change; if (tempModalQty < 1) tempModalQty = 1;
            document.getElementById('modalQtyDisplay').textContent = tempModalQty; updateModalPriceDisplay();
        }
        function updateModalPriceDisplay() {
            const item = activeMenuData.find(i => i.id === currentOpenItemId);
            if(item) document.getElementById('modalTotalPriceDisplay').textContent = `${(item.price * tempModalQty).toFixed(2)}${globalCurrency}`;
        }
        function quickAddToCart(id) {
            const item = activeMenuData.find(i => i.id === id); if(!item) return;
            const existing = cart.find(c => c.id === id);
            if (existing) existing.qty += 1; else cart.push({ ...item, qty: 1 });
            updateCartUI();
        }
        function addToCartFromModal() {
            const item = activeMenuData.find(i => i.id === currentOpenItemId); if(!item) return;
            const existing = cart.find(c => c.id === currentOpenItemId);
            if (existing) existing.qty += tempModalQty; else cart.push({ ...item, qty: tempModalQty });
            closeModal(); updateCartUI();
        }
        function updateCartUI() {
            const btn = document.getElementById('cart-floating-btn'), badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.textContent = totalItems;
            if (totalItems > 0) { btn.classList.remove('hidden'); btn.classList.add('animate-bounce'); setTimeout(() => btn.classList.remove('animate-bounce'), 1000); } 
            else { btn.classList.add('hidden'); }
            renderCartModalItems();
        }
        
        function openCartModal() {
            renderCartModalItems();
            const modal = document.getElementById('cartModal'), content = document.getElementById('cartContent');
            modal.classList.remove('hidden'); modal.classList.add('flex'); void modal.offsetWidth;
            modal.children[0].classList.remove('opacity-0'); modal.children[0].classList.add('opacity-100');
            content.classList.remove('translate-y-full', 'opacity-0'); content.classList.add('translate-y-0', 'opacity-100');
            document.body.style.overflow = 'hidden';
        }
        function closeCartModal() {
            const modal = document.getElementById('cartModal'), content = document.getElementById('cartContent');
            modal.children[0].classList.remove('opacity-100'); modal.children[0].classList.add('opacity-0');
            content.classList.remove('translate-y-0', 'opacity-100'); content.classList.add('translate-y-full', 'opacity-0');
            document.body.style.overflow = '';
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        function renderCartModalItems() {
            const container = document.getElementById('cartItemsContainer'); container.innerHTML = '';
            let subtotal = 0;
            if (cart.length === 0) { container.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fas fa-shopping-basket text-4xl mb-2"></i><p>Empty</p></div>`; }
            
            cart.forEach((item, index) => {
                subtotal += (item.price * item.qty);
                container.insertAdjacentHTML('beforeend', `
                    <div class="flex items-center gap-3 bg-white p-2 rounded-xl border border-gray-100 shadow-sm">
                        <img src="${item.img}" class="w-16 h-16 object-cover rounded-lg bg-gray-100 shrink-0">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-bold text-gray-900 truncate">${item.name}</h4>
                            <div class="text-xs text-red-500 font-extrabold mt-1">${(item.price * item.qty).toFixed(2)}${globalCurrency}</div>
                        </div>
                        <div class="flex items-center gap-2 bg-gray-50 rounded-lg p-1 border border-gray-200 shrink-0">
                            <button onclick="updateCartItemQty(${index}, -1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-gray-600 font-bold">-</button>
                            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="updateCartItemQty(${index}, 1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-gray-600 font-bold">+</button>
                        </div>
                    </div>`);
            });
            const vat = subtotal * 0.15; const total = subtotal + vat;
            document.getElementById('cartSubtotal').textContent = `${subtotal.toFixed(2)} ${globalCurrency}`;
            document.getElementById('cartVat').textContent = `${vat.toFixed(2)} ${globalCurrency}`;
            document.getElementById('cartTotal').textContent = `${total.toFixed(2)} ${globalCurrency}`;
        }
        function updateCartItemQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateCartUI(); if (cart.length === 0) closeCartModal();
        }

        function checkoutWhatsApp() {
            if(cart.length === 0 || !rawBranding.D) return;
            const orderType = document.querySelector('input[name="orderType"]:checked').value;
            const translatedType = orderType === 'Home Delivery' ? translations[currentLang].delivery : translations[currentLang].pickup;
            
            let text = currentLang === 'ar' ? `*طلب جديد* (%0A*النوع:* ${translatedType})%0A%0A` : `*New Order* (%0A*Type:* ${translatedType})%0A%0A`;
            let subtotal = 0;
            cart.forEach(item => { text += `- ${item.qty}x ${item.name} (${(item.price * item.qty).toFixed(2)}${globalCurrency})%0A`; subtotal += item.price * item.qty; });
            
            let vat = subtotal * 0.15; let total = subtotal + vat;
            text += `%0A*${translations[currentLang].subtotal}:* ${subtotal.toFixed(2)}${globalCurrency}`;
            text += `%0A*${translations[currentLang].vat}:* ${vat.toFixed(2)}${globalCurrency}`;
            text += `%0A*${translations[currentLang].total}:* ${total.toFixed(2)}${globalCurrency}`;
            
            window.open(`https://wa.me/${rawBranding.D}?text=${text}`, '_blank');
        }

        // Standard Utility Functions
        function openCategoryPage(title, isHighlight) {
            let items = isHighlight ? activeMenuData.filter(i => i.isTodaySpecial) : activeMenuData.filter(i => i.subCat === title);
            items.sort((a, b) => a.order - b.order); document.getElementById('category-page-title').textContent = title;
            const grid = document.getElementById('category-page-grid'); grid.innerHTML = '';
            items.forEach((item) => {
                const card = document.createElement('div'); card.className = `menu-card ${item.isTodaySpecial ? 'bg-amber-50/60' : 'bg-white'} rounded-2xl overflow-hidden border flex flex-col h-full`; card.onclick = () => openModal(item.id);
                let imagesHtml = ''; item.imgUrls.forEach(url => { imagesHtml += `<img src="${url}" class="w-full h-full object-cover shrink-0 snap-center">`; });
                if (item.imgUrls.length > 1) imagesHtml += `<img src="${item.imgUrls[0]}" data-is-clone="true" class="w-full h-full object-cover shrink-0 snap-center">`;
                card.innerHTML = `<div class="relative aspect-[4/3] bg-gray-100"><div class="mini-img-slider flex w-full h-full overflow-x-auto snap-x snap-mandatory hide-scrollbar">${imagesHtml}</div></div><div class="p-2 flex flex-col flex-grow"><h4 class="text-xs font-bold text-gray-900 line-clamp-1">${item.name}</h4><div class="flex justify-between items-center mt-1"><span class="font-extrabold text-red-600 text-sm">${item.price} ${globalCurrency}</span><button class="w-6 h-6 rounded-full bg-gray-100 text-red-500 flex items-center justify-center" onclick="event.stopPropagation(); quickAddToCart('${item.id}')"><i class="fas fa-plus text-[10px]"></i></button></div></div>`; grid.appendChild(card);
            });
            const modal = document.getElementById('category-page-overlay'), backdrop = document.getElementById('category-backdrop'), content = document.getElementById('category-content');
            modal.classList.remove('hidden'); modal.classList.add('flex'); void modal.offsetWidth; backdrop.classList.remove('opacity-0'); backdrop.classList.add('opacity-100'); content.classList.remove('translate-y-full', 'opacity-0'); content.classList.add('translate-y-0', 'opacity-100'); document.body.style.overflow = 'hidden';
        }
        function closeCategoryPage() {
            const modal = document.getElementById('category-page-overlay'), backdrop = document.getElementById('category-backdrop'), content = document.getElementById('category-content');
            backdrop.classList.remove('opacity-100'); backdrop.classList.add('opacity-0'); content.classList.remove('translate-y-0', 'opacity-100'); content.classList.add('translate-y-full', 'opacity-0'); document.body.style.overflow = ''; setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }
        
        let isMainCatOpen = true;
        function toggleMainCategories() {
            isMainCatOpen = !isMainCatOpen; const container = document.getElementById('main-category-container');
            isMainCatOpen ? (container.classList.remove('max-h-0', 'opacity-0'), container.classList.add('max-h-[300px]', 'opacity-100')) : (container.classList.add('max-h-0', 'opacity-0'), container.classList.remove('max-h-[300px]', 'opacity-100'));
        }
        document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); executeFilter(); });
        function openBrandModal() { document.getElementById('brandModal').classList.remove('hidden'); document.getElementById('brandModal').classList.add('flex'); }
        function closeBrandModal() { document.getElementById('brandModal').classList.remove('flex'); document.getElementById('brandModal').classList.add('hidden'); }

        // Infinite Carousel Background Engine
        setInterval(() => {
            document.querySelectorAll('.mini-img-slider, #modal-image-slider').forEach(slider => {
                if (slider.clientWidth === 0 || slider.dataset.infiniteSetup === "true") return; 
                slider.querySelectorAll('[data-is-clone="true"]').forEach(c => c.remove());
                const imgs = Array.from(slider.children);
                if (imgs.length > 1) {
                    const frontClone = imgs[imgs.length - 1].cloneNode(true); frontClone.dataset.isClone = "true";
                    const backClone = imgs[0].cloneNode(true); backClone.dataset.isClone = "true";
                    slider.insertBefore(frontClone, imgs[0]); slider.appendChild(backClone);
                    slider.dataset.infiniteSetup = "true"; slider.dataset.realCount = imgs.length;
                    const originalBehavior = slider.style.scrollBehavior;
                    slider.style.scrollBehavior = 'auto'; slider.scrollLeft = document.documentElement.dir === 'rtl' ? -slider.clientWidth : slider.clientWidth;
                    void slider.offsetWidth; slider.style.scrollBehavior = originalBehavior || 'smooth';
                }
            });
        }, 100);

        document.addEventListener('scroll', (e) => {
            if (e.target && e.target.classList && e.target.dataset.infiniteSetup === "true") {
                const slider = e.target, clientWidth = slider.clientWidth, currentPos = Math.abs(slider.scrollLeft), maxScroll = slider.scrollWidth - clientWidth;
                if (clientWidth === 0) return;
                const isRTL = document.documentElement.dir === 'rtl'; let teleported = false;
                if (currentPos <= 5) { slider.style.scrollBehavior = 'auto'; slider.scrollLeft = isRTL ? -(maxScroll - clientWidth) : (maxScroll - clientWidth); void slider.offsetWidth; slider.style.scrollBehavior = 'smooth'; teleported = true; } 
                else if (currentPos >= maxScroll - 5) { slider.style.scrollBehavior = 'auto'; slider.scrollLeft = isRTL ? -clientWidth : clientWidth; void slider.offsetWidth; slider.style.scrollBehavior = 'smooth'; teleported = true; }
                const dotsContainer = slider.nextElementSibling;
                if (dotsContainer && dotsContainer.id === 'modal-image-dots') {
                    const realCount = parseInt(slider.dataset.realCount), activePos = teleported ? Math.abs(slider.scrollLeft) : currentPos;
                    let activeIndex = Math.round(activePos / clientWidth) - 1; if (activeIndex < 0) activeIndex = realCount - 1; if (activeIndex >= realCount) activeIndex = 0;
                    Array.from(dotsContainer.children).forEach((dot, k) => { dot.className = `modal-dot w-2 h-2 rounded-full transition-all duration-300 ${k === activeIndex ? 'bg-red-500 scale-125' : 'bg-white/80 shadow-sm'}`; });
                }
            }
        }, true);

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.error(err)); }); }
        window.onload = init;
    </script>
</body>
</html>
