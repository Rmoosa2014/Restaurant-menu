<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Chef's Match 3 Premium</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/main.css"></head><body class="text-slate-100 flex items-center justify-center h-[100dvh] w-screen"><div id="app-container" class="relative w-full max-w-[400px] h-[100dvh] max-h-[850px] shadow-2xl overflow-hidden sm:rounded-[40px] sm:h-[800px] sm:border-[10px] sm:border-slate-800 bg-slate-900/60 backdrop-blur-xl"><div id="lobby-screen" class="absolute inset-0 z-40 flex flex-col pt-12 pb-6 px-4 bg-slate-900 overflow-y-auto"><h1 class="text-4xl font-black text-center text-transparent bg-clip-text bg-gradient-to-b from-amber-200 to-orange-500 mb-2 drop-shadow-lg">RECIPE MASTER</h1><p class="text-slate-400 text-center font-bold mb-6">Select a dish to start cooking!</p><div id="recipe-grid" class="grid grid-cols-3 gap-4 auto-rows-max"></div></div><div id="game-screen" class="hidden absolute inset-0 z-30 flex flex-col"><div class="absolute top-0 w-full bg-slate-900/90 backdrop-blur-md border-b border-slate-700/50 shadow-lg z-20 flex flex-col px-4 pt-5 pb-3"><div class="flex justify-between items-center mb-3"><button onclick="goToLobby()" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 transition-colors shadow-md"><i class="fas fa-arrow-left"></i></button><div class="text-center"><h2 class="text-xs text-slate-400 font-bold uppercase tracking-widest leading-tight">Current Order</h2><h1 id="ui-recipe-name" class="text-xl font-black text-amber-400 leading-tight drop-shadow-md">Burger</h1></div><div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-2xl shadow-md" id="ui-recipe-icon">🍔</div></div><div id="ui-checklist" class="flex justify-center gap-2"></div></div><div id="ui-combo" class="absolute top-[125px] w-full text-center z-30 pointer-events-none opacity-0 transition-all duration-300"><span class="bg-gradient-to-r from-pink-500 to-violet-500 text-white text-[10px] font-black px-4 py-1.5 rounded-full shadow-[0_0_15px_rgba(236,72,153,0.6)] border border-white/30 tracking-widest uppercase">COMBO x2!</span></div><div id="docking-tray" class="absolute top-[145px] left-1/2 -translate-x-1/2 p-2 bg-slate-800/90 backdrop-blur-xl rounded-2xl border-[3px] border-slate-700 shadow-[0_15px_25px_-5px_rgba(0,0,0,0.8),inset_0_5px_10px_rgba(0,0,0,0.5)] flex items-center justify-center gap-1.5 z-30"><div id="slot-0" class="slot-box"></div><div id="slot-1" class="slot-box"></div><div id="slot-2" class="slot-box"></div><div id="slot-3" class="slot-box"></div><div id="slot-4" class="slot-box"></div><div id="slot-5" class="slot-box"></div><div id="slot-6" class="slot-box"></div></div><div id="tile-layer" class="absolute inset-0 z-50 w-full h-full pointer-events-none"></div><span id="ui-score" class="hidden">0</span><span id="ui-level" class="hidden">1</span></div><div id="modal-lose" class="hidden absolute inset-0 bg-slate-950/95 z-[100] flex-col items-center justify-center p-6 backdrop-blur-lg"><div class="animate-pop flex flex-col items-center"><div class="w-28 h-28 bg-red-500/10 rounded-full flex items-center justify-center mb-6 shadow-[0_0_50px_rgba(239,68,68,0.2)] border border-red-500/20"><i class="fas fa-fire text-6xl text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]"></i></div><h2 class="text-4xl font-black text-white mb-2 tracking-wide text-center">BURNT IT!</h2><p class="text-slate-400 mb-8 text-center font-bold text-lg">Your tray got full of junk.</p><div class="flex flex-col w-full gap-3"><button onclick="retryLevel()" class="w-full py-4 bg-gradient-to-b from-red-500 to-red-700 text-white font-black rounded-2xl shadow-[0_6px_0_#7f1d1d] active:translate-y-[6px] active:shadow-[0_0_0_#7f1d1d] transition-all text-xl uppercase tracking-widest border border-red-400/50">Try Again</button><button onclick="goToLobby()" class="w-full py-4 bg-slate-800 text-slate-300 font-black rounded-2xl shadow-[0_6px_0_#0f172a] active:translate-y-[6px] active:shadow-[0_0_0_#0f172a] transition-all text-lg uppercase tracking-widest border border-slate-600">Kitchen Lobby</button></div></div></div><div id="modal-win" class="hidden absolute inset-0 bg-slate-950/95 z-[100] flex-col items-center justify-center p-6 backdrop-blur-lg"><div class="animate-pop flex flex-col items-center w-full"><div class="w-32 h-32 bg-amber-500/10 rounded-full flex items-center justify-center mb-4 shadow-[0_0_50px_rgba(251,191,36,0.3)] border border-amber-500/30"><span id="win-emoji" class="text-7xl drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]">🍔</span></div><h2 class="text-4xl font-black text-white mb-1 tracking-wide text-center">ORDER UP!</h2><p class="text-amber-400 mb-8 text-center font-bold text-xl">Perfectly Cooked!</p><button onclick="goToLobby()" class="w-full py-4 bg-gradient-to-b from-amber-400 to-orange-600 text-white font-black rounded-2xl shadow-[0_6px_0_#9a3412] active:translate-y-[6px] active:shadow-[0_0_0_#9a3412] transition-all text-xl uppercase tracking-widest border border-amber-300/50">Next Order</button></div></div></div><script src="js/data.js"></script><script src="js/audio.js"></script><script src="js/ui.js"></script><script src="js/engine.js"></script></body></html>
