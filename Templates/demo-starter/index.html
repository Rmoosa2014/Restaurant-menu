        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .menu-card { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }

    <script>
        // Security Lock
        !function(){var e=["cm1vb3NhMjAxNC5naXRodWIuaW8=","bG9jYWxob3N0","MTI3LjAuMC4x","PGRpdiBzdHlsZT0nZGlzcGxheTpmbGV4O2p1c3RpZnktY29udGVudDpjZW50ZXI7YWxpZ24taXRlbXM6Y2VudGVyO2hlaWdodDoxMDB2aDtiYWNrZ3JvdW5kLWNvbG9yOiNmOGZhZmM7Zm9udC1mYW1pbHk6c2Fucy1zZXJpZjtjb2xvcjojZWY0NDQ0Jz48aDI+VW5hdXRob3JpemVkIERvbWFpbi4gQWNjZXNzIERlbmllZC48L2gyPjwvZGl2Pg==","U2VjdXJpdHkgTG9jayBUcmlnZ2VyZWQ="],o=window.location.hostname;if(![atob(e[0]),atob(e[1]),atob(e[2])].includes(o)&&""!==o){throw document.body.innerHTML=atob(e[3]),new Error(atob(e[4]))}}();
        document.addEventListener('contextmenu', e => e.preventDefault());

        let rawBranding = {}, rawMenuEn = [], rawMenuAr = [];
        let currentLang = 'en', globalCurrency = "";
        let activeMenuData = [], mainCategories = [], allSubCategories = [];
        let selectedMainCategories = new Set(), selectedSubCategories = new Set(), searchQuery = '';
        let currentOpenItemId = null;
        let intersectionObserver = null;

        // Auto-Typing Search Animation
        const searchStrings = ["Search menu...", "Find your favorite...", "Craving something?"];
        let typeIdx = 0, charIdx = 0, isDeleting = false;
        function typeWriter() {
            const input = document.getElementById('searchInput');
            if(!input || document.activeElement === input) { setTimeout(typeWriter, 1000); return; }
            const currentString = searchStrings[typeIdx];
            if (isDeleting) {
                input.placeholder = currentString.substring(0, charIdx--);
                if (charIdx < 0) { isDeleting = false; typeIdx = (typeIdx + 1) % searchStrings.length; setTimeout(typeWriter, 500); return; }
            } else {
                input.placeholder = currentString.substring(0, charIdx++);
                if (charIdx > currentString.length) { isDeleting = true; setTimeout(typeWriter, 2000); return; }
            }
            setTimeout(typeWriter, isDeleting ? 40 : 80);
        }

        async function init() {
            try {
                const fileUrl = "MenuMasterData.json?v=" + new Date().getTime();
                const response = await fetch(fileUrl);
                const jsonData = await response.json();
                
                const sNames = Object.keys(jsonData);
                const sBrand = sNames.find(n => n.includes("01") || n.includes("Brand")) || sNames[0];
                const sMenuEn = sNames.find(n => n.includes("3") || n.includes("English")) || sNames[2];
                const sMenuAr = sNames.find(n => n.includes("4") || n.includes("Arabic")) || sNames[3];

                if(jsonData[sBrand]) rawBranding = jsonData[sBrand].find((r, i) => i > 0 && (r.K || r.B || r.L)) || jsonData[sBrand][1] || {};
                if(jsonData[sMenuEn]) rawMenuEn = jsonData[sMenuEn].slice(1);
                if(jsonData[sMenuAr]) rawMenuAr = jsonData[sMenuAr].slice(1);

                document.getElementById('loading-state').classList.add('hidden');
                applySystemSetup();
                typeWriter();
            } catch (error) { console.error("Error loading JSON"); }
        }

        function applySystemSetup() {
            let langVal = String(rawBranding.K || rawBranding.J || "english").trim().toLowerCase();
            currentLang = langVal.includes('arabic') ? 'ar' : 'en';
            globalCurrency = rawBranding.K || rawBranding.J || "";
            
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('nav-title').textContent = rawBranding.B || "Restaurant";
            document.getElementById('hero-title2').textContent = rawBranding.B || "Our Restaurant";
            document.getElementById('footer-title').textContent = rawBranding.B || "Restaurant";

            document.getElementById('f-phone').textContent = rawBranding.C || "--";
            document.getElementById('link-phone').href = rawBranding.C ? `tel:${rawBranding.C}` : '#';
            document.getElementById('f-whatsapp').textContent = rawBranding.D || "--";
            document.getElementById('link-whatsapp').href = rawBranding.D ? `https://wa.me/${rawBranding.D}` : '#';
            document.getElementById('f-email').textContent = rawBranding.F || "--";
            document.getElementById('link-email').href = rawBranding.F ? `mailto:${rawBranding.F}` : '#';
            document.getElementById('f-address').textContent = rawBranding.H || "--";
            document.getElementById('link-location').href = rawBranding.I || '#';
            
            const socialContainer = document.getElementById('social-media-container');
            socialContainer.innerHTML = '';
            if(rawBranding.J && String(rawBranding.J).trim() !== "") {
                const links = String(rawBranding.J).split(',');
                links.forEach(link => {
                    let cleanLink = link.trim();
                    if(cleanLink) {
                        let iconClass = "fas fa-link";
                        if(cleanLink.includes("instagram")) iconClass = "fab fa-instagram";
                        else if(cleanLink.includes("facebook")) iconClass = "fab fa-facebook-f";
                        else if(cleanLink.includes("twitter") || cleanLink.includes("x.com")) iconClass = "fab fa-twitter";
                        else if(cleanLink.includes("tiktok")) iconClass = "fab fa-tiktok";
                        else if(cleanLink.includes("snapchat")) iconClass = "fab fa-snapchat-ghost";
                        else if(cleanLink.includes("youtube")) iconClass = "fab fa-youtube";
                        socialContainer.innerHTML += `<a href="${cleanLink}" target="_blank" class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center hover:bg-red-500 hover:text-white transition shadow-sm text-gray-300"><i class="${iconClass}"></i></a>`;
                    }
                });
            }

            if(rawBranding.N || rawBranding.M) {
                document.getElementById('default-logo-icon').classList.add('hidden');
                document.getElementById('brand-logo-img').src = rawBranding.N || rawBranding.M;
                document.getElementById('brand-logo-img').classList.remove('hidden');
            }

            const rawSource = currentLang === 'en' ? rawMenuEn : rawMenuAr;
            formatMenuData(rawSource);
        }

        // Icon mapping for categories
        function getCategoryIcon(catName) {
            const lower = catName.toLowerCase();
            if(lower.includes('burger') || lower.includes('برجر')) return 'fa-hamburger';
            if(lower.includes('pizza') || lower.includes('بيتزا')) return 'fa-pizza-slice';
            if(lower.includes('drink') || lower.includes('juice') || lower.includes('مشروب')) return 'fa-glass-cheers';
            if(lower.includes('coffee') || lower.includes('قهوة')) return 'fa-coffee';
            if(lower.includes('salad') || lower.includes('سلطة')) return 'fa-leaf';
            if(lower.includes('dessert') || lower.includes('sweet') || lower.includes('حلى')) return 'fa-ice-cream';
            if(lower.includes('all') || lower.includes('الكل')) return 'fa-th-large';
            return 'fa-utensils';
        }

        function formatMenuData(rawSource) {
            activeMenuData = []; mainCategories = []; allSubCategories = [];
            const brandLogo = rawBranding.N || rawBranding.M || 'logo.png';

            rawSource.forEach(row => {
                if(!row.B || !row.D) return;
                const safeId = row.A ? String(row.A).trim() : Math.random().toString();
                let imgPath = brandLogo; let excelImg = "";

                if (row.H && String(row.H).trim() !== "") {
                    excelImg = String(row.H).split(',')[0].trim();
                }

                if (excelImg !== "") {
                    if (excelImg.startsWith('http')) { imgPath = excelImg; } 
                    else { imgPath = `https://raw.githubusercontent.com/Rmoosa2014/Restaurant-menu/main/images/ItemImages/${excelImg}`; }
                }
                
                const item = {
                    id: safeId, mainCat: String(row.B).trim(), subCat: String(row.C || "Other").trim(),
                    name: String(row.D).trim(), order: parseInt(row.E) || 999, price: row.F || 0,
                    desc: row.G || "", img: imgPath
                };
                activeMenuData.push(item);
                if(!mainCategories.includes(item.mainCat)) mainCategories.push(item.mainCat);
                if(!allSubCategories.includes(item.subCat)) allSubCategories.push(item.subCat);
            });
            renderCategoryFilters(); renderSubCategoryFilters(); executeFilter();
        }

        function renderCategoryFilters() {
            const row1 = document.getElementById('category-row-1'), row2 = document.getElementById('category-row-2');
            row1.innerHTML = ''; row2.innerHTML = '';
            ['All', ...mainCategories].forEach((cat, index) => {
                const isAll = cat === 'All', isActive = isAll ? selectedMainCategories.size === 0 : selectedMainCategories.has(cat);
                const btn = document.createElement('button');
                btn.className = `w-[100px] shrink-0 snap-start p-2 rounded-xl border font-bold text-[10px] transition-colors flex flex-col items-center justify-center ${isActive ? 'bg-red-500 text-white border-red-500' : 'bg-white text-gray-600'}`;
                btn.innerHTML = `<i class="fas ${getCategoryIcon(cat)} mb-1 text-lg"></i> <span class="truncate w-full text-center">${isAll ? (currentLang==='ar'?'الكل':'All') : cat}</span>`;
                btn.onclick = () => {
                    if (isAll) { selectedMainCategories.clear(); selectedSubCategories.clear(); }
                    else { selectedMainCategories.has(cat) ? selectedMainCategories.delete(cat) : selectedMainCategories.add(cat); }
                    renderCategoryFilters(); renderSubCategoryFilters(); executeFilter();
                };
                (index % 8 < 4) ? row1.appendChild(btn) : row2.appendChild(btn);
            });
        }

        function renderSubCategoryFilters() {
            const container = document.getElementById('sub-category-filters');
            container.innerHTML = '';
            let relevant = new Set();
            if (selectedMainCategories.size === 0) allSubCategories.forEach(sub => relevant.add(sub));
            else activeMenuData.forEach(i => { if (selectedMainCategories.has(i.mainCat)) relevant.add(i.subCat); });

            Array.from(relevant).sort().forEach(subCat => {
                const isActive = selectedSubCategories.has(subCat);
                const btn = document.createElement('button');
                const safeId = subCat.replace(/[^a-zA-Z0-9]/g, '');
                btn.id = `sub-btn-${safeId}`;
                btn.className = `sub-cat-btn shrink-0 px-3 py-1.5 rounded-full border text-xs font-bold transition-colors ${isActive ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-200'}`;
                btn.textContent = subCat;
                btn.onclick = () => {
                    selectedSubCategories.has(subCat) ? selectedSubCategories.delete(subCat) : selectedSubCategories.add(subCat);
                    renderSubCategoryFilters(); executeFilter();
                };
                container.appendChild(btn);
            });
        }

// 1. The Custom SVG Icon
        const newRiyalIcon = `
        <svg class="inline-block w-[0.8em] h-[0.8em] mr-1 opacity-90" viewBox="0 0 202.03 220.76" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M3.62,190.51c1.85-3.4,4.63-11.11,8.33-12.04l62.35-13.27v-30.87l-63.28,13.58c-1.23,0,3.09-13.27,3.4-13.89,1.54-3.4,4.32-11.11,8.03-12.04l51.86-11.11V20.42c0-4.94,8.64-11.73,11.42-14.51.93-.62,9.88-8.64,9.88-4.94v105.57l24.69-5.56V31.84c0-4.94,8.64-11.73,11.73-14.2.62-.93,9.57-8.64,9.57-5.25v84.27l58.34-12.35h.31l1.23-.31c.93-.31-3.09,12.96-3.7,13.89-1.54,3.09-4.32,11.11-8.03,11.73l-48.15,10.5v24.39l60.19-12.66c1.23-.31-2.78,13.27-3.4,13.89-1.54,3.4-4.32,11.11-8.03,12.04l-68.53,14.82c-.93,0-1.54,0-1.54-1.23v-46.61l-24.69,5.25v31.79c0,6.79-13.27,25-20.06,26.86v-.31L.22,204.4c-1.23.31,3.09-12.96,3.4-13.89ZM196.55,194.83c-1.54,3.09-4.32,11.11-8.33,12.04l-68.84,13.89c-.93.31,3.09-12.96,3.7-13.89,1.54-3.4,4.32-11.11,8.03-12.04l68.84-13.89c1.54-.31-3.09,12.96-3.4,13.89Z"/>
        </svg>`;

        function executeFilter() {
            // 2. The Logic to check the Excel sheet (Moved INSIDE the function)
            let finalCurrencyDisplay = (globalCurrency.toUpperCase().includes('SR')) 
                ? newRiyalIcon 
                : `<span class="text-[0.8em] mr-1 opacity-90">${globalCurrency}</span>`;

            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            let filtered = activeMenuData;
            
            if (selectedMainCategories.size > 0) filtered = filtered.filter(i => selectedMainCategories.has(i.mainCat));
            if (selectedSubCategories.size > 0) filtered = filtered.filter(i => selectedSubCategories.has(i.subCat));
            if (searchQuery) filtered = filtered.filter(i => (`${i.name} ${i.desc}`).toLowerCase().includes(searchQuery));

            const grouped = {};
            filtered.forEach(item => { if(!grouped[item.subCat]) grouped[item.subCat] = []; grouped[item.subCat].push(item); });

            // Setup Intersection Observer for scroll-sync
            if(intersectionObserver) intersectionObserver.disconnect();
            intersectionObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if(entry.isIntersecting) {
                        const subId = entry.target.id.replace('section-', '');
                        const btn = document.getElementById(`sub-btn-${subId}`);
                        if(btn) btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                });
            }, { rootMargin: '-20% 0px -70% 0px' });

            for (const subCat in grouped) {
                const items = grouped[subCat].sort((a, b) => a.order - b.order);
                const section = document.createElement('div');
                const safeId = subCat.replace(/[^a-zA-Z0-9]/g, '');
                section.id = `section-${safeId}`;
                
                section.innerHTML = `<h3 class="text-xl font-bold text-gray-800 border-b-2 border-red-100 pb-2 mb-4 pt-2">${subCat}</h3>`;
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 md:grid-cols-4 gap-3";

                items.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm flex flex-col h-full cursor-pointer";
                    card.onclick = () => openModal(item.id);
                    card.innerHTML = `
                        <div class="relative aspect-[4/3] bg-gray-100"><img src="${item.img}" class="w-full h-full object-cover" onerror="this.onerror=null; this.classList.replace('object-cover', 'object-contain'); this.classList.add('p-4'); this.src='${rawBranding.N || rawBranding.M || 'https://raw.githubusercontent.com/Rmoosa2014/Restaurant-menu/main/images/logo.png'}';"></div>
                        <div class="p-3 flex flex-col flex-grow">
                            <h4 class="text-sm font-bold text-gray-900 line-clamp-1">${item.name}</h4>
                            <span class="font-extrabold text-red-600 mt-1 flex items-baseline">
    ${finalCurrencyDisplay}
    ${item.price}
</span>
                        </div>`;
                    grid.appendChild(card);
                });
                section.appendChild(grid); 
                container.appendChild(section);
                intersectionObserver.observe(section);
            }
            container.classList.remove('hidden'); container.classList.add('flex');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); executeFilter(); });

        // Go to Top Scroll Listener
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('goTopBtn');
            if (window.scrollY > 300) { btn.classList.remove('scale-0', 'opacity-0', 'pointer-events-none'); btn.classList.add('scale-100', 'opacity-100'); } 
            else { btn.classList.add('scale-0', 'opacity-0', 'pointer-events-none'); btn.classList.remove('scale-100', 'opacity-100'); }
        });

        // Swipe-to-Close Modal Logic
        const modalContent = document.getElementById('modalContent');
        const modalScrollArea = document.getElementById('modalScrollArea');
        let startY = 0, currentY = 0;
        
        modalContent.addEventListener('touchstart', (e) => {
            if(modalScrollArea.scrollTop === 0) startY = e.touches[0].clientY;
        }, {passive: true});
        
        modalContent.addEventListener('touchmove', (e) => {
            if(startY === 0) return;
            currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if(diff > 0) { modalContent.style.transform = `translateY(${diff}px)`; modalContent.style.transition = 'none'; }
        }, {passive: true});
        
        modalContent.addEventListener('touchend', (e) => {
            if(startY === 0) return;
            const diff = currentY - startY;
            modalContent.style.transition = 'all 0.3s ease';
            if(diff > 120) closeModal(); else modalContent.style.transform = '';
            startY = 0;
        });

        function openModal(id) {
            const item = activeMenuData.find(i => i.id === id);
            if (!item) return;
            currentOpenItemId = id;
            document.getElementById('modal-image').src = item.img;
            document.getElementById('modalCategoryBadge').textContent = item.subCat;
            document.getElementById('modalTitle').textContent = item.name;
            // 1. Check if it is SR and swap the SVG
    // 1. Check if it is SR and swap the SVG
    let modalCurrencyDisplay = (globalCurrency.toUpperCase().includes('SR')) 
        ? newRiyalIcon 
        : `<span class="text-[0.8em] mr-1.5 opacity-90">${globalCurrency}</span>`;

    // 2. Display the newly formatted price
    document.getElementById('modalPrice').innerHTML = `
    <div class="flex items-baseline">
        ${modalCurrencyDisplay}
        ${item.price}
    </div>`;
            document.getElementById('modalDesc').textContent = item.desc;
            
            const modal = document.getElementById('productModal'), backdrop = document.getElementById('modalBackdrop'), content = document.getElementById('modalContent');
            content.style.transform = ''; // Reset swipe transform
            modal.classList.remove('hidden'); modal.classList.add('flex'); void modal.offsetWidth;
            backdrop.classList.remove('opacity-0'); backdrop.classList.add('opacity-100');
            content.classList.remove('translate-y-full', 'opacity-0'); content.classList.add('translate-y-0', 'opacity-100');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('productModal'), backdrop = document.getElementById('modalBackdrop'), content = document.getElementById('modalContent');
            backdrop.classList.remove('opacity-100'); backdrop.classList.add('opacity-0');
            content.classList.remove('translate-y-0', 'opacity-100'); content.classList.add('translate-y-full', 'opacity-0');
            document.body.style.overflow = '';
            setTimeout(() => { modal.classList.remove('flex'); modal.classList.add('hidden'); content.style.transform = ''; }, 300);
        }

        let isMainCatOpen = true;
        function toggleMainCategories() {
            isMainCatOpen = !isMainCatOpen;
            const container = document.getElementById('main-category-container');
            const icon = document.getElementById('category-toggle-icon');
            if (isMainCatOpen) {
                container.classList.remove('max-h-0', 'opacity-0'); container.classList.add('max-h-[300px]', 'opacity-100');
                icon.style.transform = 'rotate(0deg)';
            } else {
                container.classList.add('max-h-0', 'opacity-0'); container.classList.remove('max-h-[300px]', 'opacity-100');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function openBrandModal() { document.getElementById('brandModal').classList.remove('hidden'); document.getElementById('brandModal').classList.add('flex'); }
        function closeBrandModal() { document.getElementById('brandModal').classList.remove('flex'); document.getElementById('brandModal').classList.add('hidden'); }
        function callPhone() { if(rawBranding.C) window.location.href = `tel:${rawBranding.C}`; }
        function shareItem() { if(navigator.share) navigator.share({ title: 'Restaurant', url: window.location.href }); }

        window.onload = init;
    </script>
</body>
</html>
