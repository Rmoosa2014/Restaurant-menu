<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ef4444">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap');
        :root { --font-en: 'Poppins', sans-serif; --font-ar: 'Cairo', sans-serif; }
        body[dir="ltr"] { font-family: var(--font-en); }
        body[dir="rtl"] { font-family: var(--font-ar); }
        body { background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .menu-card { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800 antialiased transition-colors duration-300" ondragstart="return false;" onselectstart="return false;">
    <nav class="bg-white/90 backdrop-blur-md shadow-sm fixed w-full z-40 top-0 transition-all duration-300 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                    </div>
                    <span id="nav-title" onclick="openBrandModal()" class="font-bold text-lg sm:text-xl tracking-tight text-gray-900 truncate cursor-pointer hover:text-red-600">Loading...</span>
                </div>
            </div>

    </nav>

    <header id="hero-section" class="pt-24 pb-10 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-center relative overflow-hidden rounded-b-3xl sm:rounded-b-none bg-gray-900 text-white mb-2 bg-cover bg-center" style="background-image: linear-gradient(to bottom, rgba(17,24,39,0.8), rgba(17,24,39,0.95));">

        </div>

    <section id="filter-header-island" class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 mb-2 sticky top-[64px] z-40 bg-[#f8fafc] py-2 transition-all duration-300 shadow-[0_8px_15px_-3px_rgba(0,0,0,0.05)] rounded-b-2xl border-b border-gray-100">

            <div class="absolute inset-y-0 start-0 flex items-center pointer-events-none px-3 z-10"><i class="fas fa-search text-gray-400"></i></div>
            <div id="search-placeholder-wrapper" class="absolute inset-y-0 start-10 end-4 flex items-center pointer-events-none z-10 text-sm font-medium text-gray-400">

                        <span class="truncate h-5 leading-5 block" id="search-text-1"></span>
                        <span class="truncate h-5 leading-5 block" id="search-text-2"></span>
                    </div>
                </div>
            </div>
            <input type="text" id="searchInput" class="block w-full ps-10 pe-3 py-2 leading-5 bg-transparent focus:outline-none sm:text-sm relative z-20 text-gray-900 font-bold" placeholder="">
        </div>
        <div id="main-category-container" class="max-h-[300px] opacity-100 overflow-hidden transition-all duration-300">

        </div>
    </section>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-20 min-h-[50vh]">

    <!-- Clean Product Modal -->
    <div id="productModal" class="fixed inset-0 z-[80] hidden items-end md:items-center justify-center p-0 md:p-6">

                    <div class="flex gap-3">
                        <button onclick="callPhone()" class="flex-1 bg-gray-900 text-white py-2.5 rounded-xl font-bold hover:bg-gray-800 transition flex items-center justify-center gap-2"><i class="fas fa-phone-alt"></i> Call</button>
                        <button onclick="shareItem()" class="flex-1 border-2 border-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold hover:bg-gray-50 transition flex items-center justify-center gap-2"><i class="fas fa-share-alt text-red-500"></i> Share</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Brand Modal -->
    <div id="brandModal" class="fixed inset-0 z-[110] hidden items-end md:items-center justify-center p-0 md:p-6">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-300" id="brandModalBackdrop" onclick="closeBrandModal()"></div>
        <div class="relative z-10 bg-white rounded-t-3xl md:rounded-3xl w-full md:max-w-md overflow-hidden shadow-2xl transform translate-y-full md:scale-95 opacity-0 transition-all duration-300 flex flex-col max-h-[90vh]" id="brandModalContent">
            <button onclick="closeBrandModal()" class="absolute top-3 right-3 z-30 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fas fa-times"></i></button>
            <div class="relative w-full shrink-0 bg-gray-900 flex flex-col items-center pt-10 pb-8 border-b border-gray-800">
                <div class="w-36 h-36 bg-white rounded-full p-4 shadow-2xl mb-4 relative z-10 flex items-center justify-center"><img id="brandModalImage" src="" class="max-w-full max-h-full object-contain"></div>
                <h2 id="brandModalTitle" class="text-2xl font-extrabold text-white text-center z-10 px-4"></h2>
            </div>
            <div class="p-5 bg-gray-50 overflow-y-auto">
                <p id="brandModalDesc" class="text-gray-600 mb-6 text-sm"></p>
                <div class="flex flex-col gap-3 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex items-center gap-3 text-sm text-gray-700 cursor-pointer" onclick="callPhone()"><div class="w-8 h-8 rounded-full bg-red-50 flex items-center justify-center text-red-500"><i class="fas fa-phone"></i></div><span id="brandModalPhone" class="font-bold"></span></div>
                    <div class="flex items-center gap-3 text-sm text-gray-700 cursor-pointer" onclick="openWhatsApp()"><div class="w-8 h-8 rounded-full bg-green-50 flex items-center justify-center text-green-500"><i class="fab fa-whatsapp"></i></div><span id="brandModalWA" class="font-bold"></span></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="category-page-overlay" class="fixed inset-0 z-[70] hidden items-end md:items-center justify-center p-0 md:p-6">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-300" id="category-backdrop" onclick="closeCategoryPage()"></div>
        <div class="relative z-10 w-full md:max-w-2xl bg-[#f8fafc] rounded-t-3xl md:rounded-3xl overflow-hidden shadow-2xl flex flex-col h-[90vh] md:h-[80vh] transform translate-y-full md:scale-95 opacity-0 transition-all duration-300" id="category-content">
            <div class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-20 border-b border-gray-100 px-4 h-16 flex items-center gap-4 shrink-0">
                <button onclick="closeCategoryPage()" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 hover:bg-gray-200 transition shadow-sm"><i class="fas fa-arrow-left"></i></button>
                <h2 id="category-page-title" class="text-xl font-bold text-gray-900 truncate">Category Name</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-4 sm:p-6"><div id="category-page-grid" class="grid grid-cols-2 gap-3 sm:gap-4"></div></div>
        </div>
    </div>

    <button id="back-to-top-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex opacity-0 pointer-events-none transition-all duration-500 fixed bottom-6 right-6 z-40 bg-gray-800 text-white w-10 h-10 rounded-full items-center justify-center shadow-lg"><i class="fas fa-arrow-up"></i></button>
<script>
        const newRiyalIcon = `
        <svg class="inline-block w-[0.8em] h-[0.8em] mr-1 opacity-90" viewBox="0 0 202.03 220.76" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M3.62,190.51c1.85-3.4,4.63-11.11,8.33-12.04l62.35-13.27v-30.87l-63.28,13.58c-1.23,0,3.09-13.27,3.4-13.89,1.54-3.4,4.32-11.11,8.03-12.04l51.86-11.11V20.42c0-4.94,8.64-11.73,11.42-14.51.93-.62,9.88-8.64,9.88-4.94v105.57l24.69-5.56V31.84c0-4.94,8.64-11.73,11.73-14.2.62-.93,9.57-8.64,9.57-5.25v84.27l58.34-12.35h.31l1.23-.31c.93-.31-3.09,12.96-3.7,13.89-1.54,3.09-4.32,11.11-8.03,11.73l-48.15,10.5v24.39l60.19-12.66c1.23-.31-2.78,13.27-3.4,13.89-1.54,3.4-4.32,11.11-8.03,12.04l-68.53,14.82c-.93,0-1.54,0-1.54-1.23v-46.61l-24.69,5.25v31.79c0,6.79-13.27,25-20.06,26.86v-.31L.22,204.4c-1.23.31,3.09-12.96,3.4-13.89ZM196.55,194.83c-1.54,3.09-4.32,11.11-8.33,12.04l-68.84,13.89c-.93.31,3.09-12.96,3.7-13.89,1.54-3.4,4.32-11.11,8.03-12.04l68.84-13.89c1.54-.31-3.09,12.96-3.4,13.89Z"/>
        </svg>`;

        let rawBranding = {}, rawMenu = [];
        let globalCurrency = "", currentLang = 'en';
        let activeMenuData = [], mainCategories = [], allSubCategories = [];
        let selectedMainCategories = new Set(), selectedSubCategories = new Set(), searchQuery = '';
        let currentOpenItemId = null, likedItems = new Set(JSON.parse(localStorage.getItem('likedItems')) || []);
        let lastSliderInteraction = 0; // Fixes the swiper tracking safely

        async function init() {
            try {
                // Pointing to your local JSON directly!
                const response = await fetch("MenuMasterData.json?v=" + new Date().getTime());
                if (!response.ok) throw new Error("Could not fetch JSON file");
                
                const jsonData = await response.json();
                const sNames = Object.keys(jsonData);
                
                const sBrand = sNames.find(n => n.includes("01") || n.toLowerCase().includes("brand")) || sNames[0];
                const sMenu = sNames.find(n => n.includes("02") || n.toLowerCase().includes("menu")) || sNames[1];

                if(sBrand && jsonData[sBrand]) {
                    rawBranding = jsonData[sBrand].find((r, i) => i > 0 && (r.K || r.B || r.M)) || jsonData[sBrand][1] || {};
                }
                if(sMenu && jsonData[sMenu]) {
                    rawMenu = jsonData[sMenu].slice(1);
                }

                document.getElementById('loading-state').classList.add('hidden');
                applySystemSetup();
            } catch (error) {
                document.getElementById('loading-state').innerHTML = '<p class="text-red-500 font-bold p-10 text-center">Error loading MenuMasterData.json</p>';
            }
        }

        function applySystemSetup() {
            // Precise Excel Column Mapping
            rawBranding.smartCurrency = rawBranding.K || "";
            rawBranding.smartDelivery = rawBranding.M || "";
            rawBranding.smartLogo = rawBranding.N || "";
            rawBranding.smartSocial = rawBranding.J || "";
            globalCurrency = rawBranding.smartCurrency;

            document.getElementById('nav-title').textContent = rawBranding.B || "Restaurant";
            document.getElementById('footer-title').textContent = rawBranding.B || "Restaurant";
            document.getElementById('hero-title2').textContent = rawBranding.B || "Restaurant";
            document.getElementById('f-phone').textContent = rawBranding.C || "--";
            document.getElementById('f-whatsapp').textContent = rawBranding.D || "--";
            document.getElementById('f-address').textContent = rawBranding.H || "--";
            
            // Added Email Mapping from Column F!
            const emailEl = document.getElementById('f-email');
            emailEl.textContent = rawBranding.F || "--";
            
            formatMenuData();
            
            if(rawBranding.smartLogo) {
                document.getElementById('default-logo-icon').classList.add('hidden');
                document.getElementById('brand-logo-img').src = rawBranding.smartLogo;
                document.getElementById('brand-logo-img').classList.remove('hidden');
            }
            formatMenuData();
        }
function formatMenuData() {
            activeMenuData = []; mainCategories = []; allSubCategories = [];
            const brandLogo = rawBranding.smartLogo || 'logo.png';

            rawMenu.forEach(row => {
                if(!row.B || !row.D) return;
                const safeId = row.A ? String(row.A).trim() : Math.random().toString();
                
                const item = {
                    id: safeId,
                    mainCat: String(row.B).trim(),
                    subCat: String(row.C || "Other").trim(),
                    name: String(row.D).trim(),
                    order: parseInt(row.E) || 999, 
                    price: row.F || 0,
                    desc: row.G || "",
                    calories: row.H || "",
                    recipe: row.I || "",
                    // Checks Column K for the word 'special'
                    isTodaySpecial: String(row.K || "").toLowerCase().includes('special'),
                    imgUrls: (() => {
                        let urls = [];
                        if (row.J) {
                            urls = String(row.J).split(',').map(u => {
                                let clean = u.trim();
                                if (!clean) return null;
                                if (!clean.startsWith('http')) return `https://raw.githubusercontent.com/Rmoosa2014/Restaurant-menu/main/images/ItemImages/${clean}`;
                                return clean;
                            }).filter(u => u !== null);
                        } else urls.push(brandLogo);
                        return [...new Set(urls)];
                    })(),
                    img: (() => {
                        if (row.J) {
                            let first = String(row.J).split(',')[0].trim();
                            return first.startsWith('http') ? first : `https://raw.githubusercontent.com/Rmoosa2014/Restaurant-menu/main/images/ItemImages/${first}`;
                        }
                        return brandLogo;
                    })()
                };

                activeMenuData.push(item);
                if(!mainCategories.includes(item.mainCat)) mainCategories.push(item.mainCat);
                if(!allSubCategories.includes(item.subCat)) allSubCategories.push(item.subCat);
            });
            renderCategoryFilters(); renderSubCategoryFilters(); executeFilter();
            animateSearchPlaceholder(); // Starts the typing animation!
        }

        function getCategoryIcon(catName) {
            const lower = catName.toLowerCase();
            if(lower.includes('burger')) return 'fa-hamburger';
            if(lower.includes('pizza')) return 'fa-pizza-slice';
            if(lower.includes('drink') || lower.includes('beverage') || lower.includes('juice') || lower.includes('shake')) return 'fa-glass-cheers';
            if(lower.includes('salad')) return 'fa-leaf';
            if(lower.includes('dessert') || lower.includes('sweet') || lower.includes('ice cream')) return 'fa-ice-cream';
            if(lower.includes('coffee')) return 'fa-coffee';
            if(lower.includes('chicken')) return 'fa-drumstick-bite';
            if(lower.includes('fish') || lower.includes('seafood')) return 'fa-fish';
            if(lower.includes('sandwich')) return 'fa-hotdog';
            if(lower.includes('soup')) return 'fa-mug-hot';
            if(lower.includes('breakfast') || lower.includes('bread')) return 'fa-egg';
            if(lower.includes('meat')) return 'fa-bacon';
            return 'fa-utensils'; 
        }

        function setupDraggable(elementId) {
            const slider = document.getElementById(elementId);
            if(!slider) return;
            let isDown = false; let startX; let scrollLeft;
            slider.addEventListener('mousedown', (e) => { isDown = true; slider.classList.add('cursor-grabbing'); startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
            slider.addEventListener('mouseleave', () => { isDown = false; slider.classList.remove('cursor-grabbing'); });
            slider.addEventListener('mouseup', () => { isDown = false; slider.classList.remove('cursor-grabbing'); });
            slider.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); const x = e.pageX - slider.offsetLeft; const walk = (x - startX) * 2; slider.scrollLeft = scrollLeft - walk; });
        }

        function renderCategoryFilters() {
            const row1 = document.getElementById('category-row-1'), row2 = document.getElementById('category-row-2');
            row1.innerHTML = ''; row2.innerHTML = '';
            
            const activeClass = 'bg-red-500 text-white border-red-500 shadow-sm z-10';
            const inactiveClass = 'bg-white text-gray-600 border-gray-200 hover:bg-red-50 hover:text-red-500';

            ['All', ...mainCategories].forEach((cat, index) => {
                const isAll = cat === 'All';
                const isActive = isAll ? selectedMainCategories.size === 0 : selectedMainCategories.has(cat);
                const icon = isAll ? 'fa-th-large' : getCategoryIcon(cat);
                
                const btn = document.createElement('button');
                btn.className = `w-[calc(25vw-9px)] sm:w-[120px] shrink-0 snap-start flex flex-col items-center justify-center gap-1 whitespace-nowrap p-1.5 rounded-xl border font-bold text-[10px] leading-tight transition-colors ${isActive ? activeClass : inactiveClass}`;
                btn.innerHTML = `<i class="fas ${icon} text-sm ${isActive ? 'text-white' : 'text-red-400'}"></i> <span class="truncate w-full text-center">${cat}</span>`;
                
                btn.onclick = () => { 
                    if(isAll){ selectedMainCategories.clear(); selectedSubCategories.clear(); }
                    else { selectedMainCategories.has(cat) ? selectedMainCategories.delete(cat) : selectedMainCategories.add(cat); }
                    renderCategoryFilters(); renderSubCategoryFilters(); executeFilter(); 
                    
                    const menuContainer = document.getElementById('menu-container');
                    if (menuContainer) {
                        const menuTop = menuContainer.getBoundingClientRect().top + window.scrollY;
                        window.scrollTo({ top: menuTop - 190, behavior: 'smooth' });
                    }
                };
                index % 8 < 4 ? row1.appendChild(btn) : row2.appendChild(btn);
            });
            setupDraggable('main-category-wrapper');
        }

        function renderSubCategoryFilters() {
            const container = document.getElementById('sub-category-filters'); container.innerHTML = '';
            const activeClass = 'bg-gray-800 text-white border-gray-800 shadow-sm';
            const inactiveClass = 'bg-white text-gray-600 border-gray-200 hover:bg-gray-100';

            let relevantSubCats = new Set();
            if (selectedMainCategories.size === 0) allSubCategories.forEach(sub => relevantSubCats.add(sub));
            else activeMenuData.forEach(item => { if (selectedMainCategories.has(item.mainCat)) relevantSubCats.add(item.subCat); });

            Array.from(relevantSubCats).sort().forEach(subCat => {
                const isActive = selectedSubCategories.has(subCat), btn = document.createElement('button');
                const safeId = subCat.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
                btn.id = `sub-btn-${safeId}`;
                btn.className = `sub-cat-btn shrink-0 px-3 py-1.5 rounded-full border text-xs font-bold transition-colors ${isActive ? activeClass : inactiveClass}`;
                btn.textContent = subCat;
                btn.onclick = () => { 
                    selectedSubCategories.has(subCat) ? selectedSubCategories.delete(subCat) : selectedSubCategories.add(subCat); 
                    renderSubCategoryFilters(); executeFilter(); 
                    
                    const menuContainer = document.getElementById('menu-container');
                    if (menuContainer) {
                        const menuTop = menuContainer.getBoundingClientRect().top + window.scrollY;
                        window.scrollTo({ top: menuTop - 190, behavior: 'smooth' });
                    }
                };
                container.appendChild(btn);
            });
            setupDraggable('sub-category-filters');
        }

        function executeFilter() {
            const container = document.getElementById('menu-container'), emptyState = document.getElementById('empty-state');
            container.innerHTML = ''; let hasItems = false;
            let filteredData = activeMenuData;
            
            // Clear default placeholder so animation shows properly
            document.getElementById('searchInput').placeholder = '';
            
            if (selectedMainCategories.size > 0) filteredData = filteredData.filter(i => selectedMainCategories.has(i.mainCat));
            if (selectedSubCategories.size > 0) filteredData = filteredData.filter(i => selectedSubCategories.has(i.subCat));
            
            if (searchQuery) {
                const searchWords = searchQuery.toLowerCase().split(' ').filter(word => word.trim() !== '');
                filteredData = filteredData.filter(i => {
                    const searchableText = `${i.name} ${i.desc} ${i.mainCat} ${i.subCat}`.toLowerCase();
                    return searchWords.every(word => searchableText.includes(word));
                });
            }

            if (selectedMainCategories.size === 0 && selectedSubCategories.size === 0 && !searchQuery) {
                const specials = activeMenuData.filter(i => i.isTodaySpecial);
                if (specials.length > 0) {
                    hasItems = true;
                    specials.sort((a, b) => a.order - b.order);
                    renderSection("🌟 Today's Specials", specials, container, true);
                }
            }

            const grouped = {};
            filteredData.forEach(item => { if(!grouped[item.subCat]) grouped[item.subCat] = []; grouped[item.subCat].push(item); });

            for (const subCat in grouped) {
                hasItems = true;
                const items = grouped[subCat].sort((a, b) => a.order - b.order);
                renderSection(subCat, items, container, false);
            }
            
            if(!hasItems) { container.classList.add('hidden'); emptyState.classList.remove('hidden'); } 
            else { container.classList.remove('hidden'); container.classList.add('flex'); emptyState.classList.add('hidden'); }
        }

        function toggleLike(e, id) { e.stopPropagation(); likedItems.has(id) ? likedItems.delete(id) : likedItems.add(id); localStorage.setItem('likedItems', JSON.stringify([...likedItems])); executeFilter(); }
        function callPhone() { if(rawBranding.C) window.location.href = `tel:${rawBranding.C}`; }

            if(!currentOpenItemId || !rawBranding.D) return;
            const item = activeMenuData.find(i => i.id === currentOpenItemId);
            window.open(`https://wa.me/${rawBranding.D}?text=${encodeURIComponent(`Hi, I would like to order: ${item.name} (${item.price}${globalCurrency})`)}`, '_blank');
        }
        function shareItem() {
            if(!currentOpenItemId) return; const item = activeMenuData.find(i => i.id === currentOpenItemId);
            if(navigator.share) navigator.share({ title: item.name, text: `Check out ${item.name}!`, url: window.location.href });
        }
        window.toggleRecipe = function(forceCollapse = false) { 
            const p = document.getElementById('modalRecipe'); 
            if(forceCollapse) p.classList.add('line-clamp-2'); 
            else p.classList.toggle('line-clamp-2'); 
        };
        function toggleMainCategories() { document.getElementById('main-category-container').classList.toggle('max-h-0'); document.getElementById('main-category-container').classList.toggle('opacity-0'); }

        document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); executeFilter(); });
        
        document.addEventListener('touchstart', () => lastSliderInteraction = Date.now(), {passive: true});
        document.addEventListener('mousedown', () => lastSliderInteraction = Date.now());
        
        setInterval(() => {
            if (Date.now() - lastSliderInteraction < 3000) return;
            document.querySelectorAll('.mini-img-slider, #modal-image-slider').forEach(slider => {
                if(slider.children.length > 1) {
                    let maxScroll = slider.scrollWidth - slider.clientWidth;
                    if(Math.abs(slider.scrollLeft) >= maxScroll - 5) { slider.scrollTo({ left: 0, behavior: 'smooth' }); } 
                    else { slider.scrollTo({ left: slider.scrollLeft + slider.clientWidth, behavior: 'smooth' }); }
                }
            });
        }, 4000);

        // 1. Full App ScrollSpy, Auto-Hide, & Go To Top Logic
        let isMainCatOpen = true;
        let lastScrollY = window.scrollY;
        let hasPassedHeader = false;
        let autoCloseTimeout;
        let menuOpenScrollY = 0;
        let ignoreScrollUntil = 0;
        let uiScrollTimeout;

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            const hideThreshold = 150; 

            // Auto-hide ONLY once when scrolling past the header
            if (currentScrollY > hideThreshold && !hasPassedHeader) {
                hasPassedHeader = true;
                if (isMainCatOpen) toggleMainCategories(false);
            } 
            else if (currentScrollY <= hideThreshold && hasPassedHeader) {
                hasPassedHeader = false;
                if (!isMainCatOpen) toggleMainCategories(true);
            }

            // User interaction checks
            if (hasPassedHeader && isMainCatOpen) {
                if (Date.now() > ignoreScrollUntil) {
                    if (Math.abs(currentScrollY - menuOpenScrollY) > 50) {
                        clearTimeout(autoCloseTimeout);
                        autoCloseTimeout = setTimeout(() => {
                            if (isMainCatOpen) toggleMainCategories(false);
                        }, 200); 
                    }
                } else {
                    menuOpenScrollY = currentScrollY;
                }
            }

            // ScrollSpy for Horizontal Sub-Categories
            const sections = document.querySelectorAll('.menu-section-tracker');
            let currentActiveSectionId = null;
            
            sections.forEach(sec => {
                const rect = sec.getBoundingClientRect();
                if (rect.top <= 180 && rect.bottom >= 180) {
                    currentActiveSectionId = sec.id.replace('section-', '');
                }
            });

            if (currentActiveSectionId) {
                const activeBtn = document.getElementById('sub-btn-' + currentActiveSectionId);
                const subContainer = document.getElementById('sub-category-filters');
                
                if (activeBtn && subContainer) {
                    subContainer.scrollTo({
                        left: activeBtn.offsetLeft - 10,
                        behavior: 'smooth'
                    });
                    
                    document.querySelectorAll('.sub-cat-btn').forEach(b => {
                        b.classList.remove('bg-gray-800', 'text-white', 'border-gray-800');
                        b.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
                    });
                    activeBtn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
                    activeBtn.classList.add('bg-gray-800', 'text-white', 'border-gray-800');
                }
            }

            // Go to top button fade logic
            const backToTopBtn = document.getElementById('back-to-top-btn');
            if (backToTopBtn) {
                backToTopBtn.classList.add('opacity-0', 'pointer-events-none');
                backToTopBtn.classList.remove('opacity-100');
            }

            clearTimeout(uiScrollTimeout);
            uiScrollTimeout = setTimeout(() => {
                const totalPageHeight = document.documentElement.scrollHeight - window.innerHeight;
                const scrollPercentage = (currentScrollY / totalPageHeight) * 100;

                if (backToTopBtn && scrollPercentage >= 30) {
                    backToTopBtn.classList.remove('opacity-0', 'pointer-events-none');
                    backToTopBtn.classList.add('opacity-100');
                }
            }, 1000); 
        }, {passive: true});

        function toggleMainCategories(forceState) {
            const container = document.getElementById('main-category-container');
            const icon = document.getElementById('category-toggle-icon');
            
            if (forceState !== undefined) isMainCatOpen = forceState;
            else isMainCatOpen = !isMainCatOpen;

            if (isMainCatOpen) {
                ignoreScrollUntil = Date.now() + 800; 
                menuOpenScrollY = window.scrollY; 
                container.classList.remove('max-h-0', 'opacity-0');
                container.classList.add('max-h-[300px]', 'opacity-100');
                if (icon) {
                    icon.classList.remove('fa-chevron-down', 'text-gray-500');
                    icon.classList.add('fa-chevron-up', 'text-red-400');
                }
            } else {
                container.classList.add('max-h-0', 'opacity-0');
                container.classList.remove('max-h-[300px]', 'opacity-100');
                if (icon) {
                    icon.classList.remove('fa-chevron-up', 'text-red-400');
                    icon.classList.add('fa-chevron-down', 'text-gray-500');
                }
            }
        }
        
        // Ensure Touch-to-close on the header island works
        const island = document.getElementById('filter-header-island');
        let touchStartY = 0;
        island.addEventListener('touchstart', e => { touchStartY = e.changedTouches[0].screenY; }, {passive: true});
        island.addEventListener('touchend', e => {
            const touchEndY = e.changedTouches[0].screenY;
            if (touchEndY > touchStartY + 30) toggleMainCategories(true); 
            else if (touchEndY < touchStartY - 30) toggleMainCategories(false); 
        }, {passive: true});

        // 2. Animated Search Placeholder Logic
        let placeholderTimer;
        function animateSearchPlaceholder() {
            clearInterval(placeholderTimer);
            const container = document.getElementById('animated-placeholder-container');
            const span1 = document.getElementById('search-text-1');
            const span2 = document.getElementById('search-text-2');
            
            if (!container || activeMenuData.length === 0) return;

            const suggestions = [...activeMenuData].sort(() => 0.5 - Math.random()).slice(0, 5).map(item => item.name);
            let currentIndex = 0;
            
            document.getElementById('search-prefix').innerText = currentLang === 'en' ? 'Try searching "' : 'جرب البحث عن "';
            span1.innerText = suggestions[0] + '"...';

            placeholderTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % suggestions.length;
                span2.innerText = suggestions[currentIndex] + '"...';
                
                container.style.transition = 'transform 0.5s ease-in-out';
                container.style.transform = 'translateY(-20px)';

                setTimeout(() => {
                    container.style.transition = 'none';
                    span1.innerText = span2.innerText;
                    container.style.transform = 'translateY(0)';
                }, 500); 
            }, 3000);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => { 
            const placeholderWrapper = document.getElementById('search-placeholder-wrapper');
            if(e.target.value.length > 0) placeholderWrapper.classList.add('opacity-0');
            else placeholderWrapper.classList.remove('opacity-0');
            searchQuery = e.target.value.toLowerCase().trim(); 
            executeFilter(); 
        });
        
        // 3. Premium Swipe-To-Close Modal Physics
        const pModal = document.getElementById('productModal');
        const pContent = document.getElementById('modalContent');
        let pullStartY = 0;
        let isPulling = false;

        pModal.addEventListener('touchstart', (e) => {
            const scrollArea = pContent.querySelector('.overflow-y-auto');
            if (scrollArea && scrollArea.scrollTop <= 0) {
                pullStartY = e.touches[0].clientY;
                isPulling = true;
                pContent.classList.remove('transition-all', 'duration-300');
            } else isPulling = false;
        }, { passive: true });

        pModal.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            const deltaY = e.touches[0].clientY - pullStartY;
            if (deltaY > 0) {
                if (e.cancelable) e.preventDefault(); 
                pContent.style.transform = `translateY(${deltaY * 0.4}px)`;
            } else {
                pContent.style.transform = '';
                isPulling = false; 
            }
        }, { passive: false });

        pModal.addEventListener('touchend', () => {
            if (!isPulling) return;
            isPulling = false;
            pContent.classList.add('transition-all', 'duration-300');
            const currentPullAmount = parseInt(pContent.style.transform.replace(/[^\d.]/g, '') || "0");
            if (currentPullAmount > 100) { pContent.style.transform = ''; closeModal(); } 
            else pContent.style.transform = ''; 
        });

        // --- 4. Premium Infinite Bidirectional Carousel & Dot Engine ---
        
        // A. Automatically injects clones at both the start and end of the image list
        function maintainInfiniteCarousels() {
            document.querySelectorAll('.mini-img-slider, #modal-image-slider').forEach(slider => {
                if (slider.clientWidth === 0 || slider.dataset.infiniteSetup === "true") return; 
                
                // Clear any old, single HTML clones first
                slider.querySelectorAll('[data-is-clone="true"]').forEach(c => c.remove());
                
                const imgs = Array.from(slider.children);
                if (imgs.length > 1) {
                    // Create Front Clone (Last Image) for backwards swiping
                    const frontClone = imgs[imgs.length - 1].cloneNode(true);
                    frontClone.dataset.isClone = "true";
                    
                    // Create Back Clone (First Image) for forwards swiping
                    const backClone = imgs[0].cloneNode(true);
                    backClone.dataset.isClone = "true";
                    
                    // Inject Dual Clones
                    slider.insertBefore(frontClone, imgs[0]);
                    slider.appendChild(backClone);
                    
                    slider.dataset.infiniteSetup = "true";
                    slider.dataset.realCount = imgs.length; // The true number of images

                    // Disable smooth scroll temporarily to jump past the front clone invisibly
                    const originalBehavior = slider.style.scrollBehavior;
                    slider.style.scrollBehavior = 'auto'; 
                    const isRTL = document.documentElement.dir === 'rtl';
                    slider.scrollLeft = isRTL ? -slider.clientWidth : slider.clientWidth;
                    void slider.offsetWidth; // Force jump
                    slider.style.scrollBehavior = originalBehavior || 'smooth'; 
                }
            });
        }
        
        // Run constantly to catch new pop-up modals opening
        setInterval(maintainInfiniteCarousels, 100);

        // B. Global Teleporter & Red Dot Sync Engine
        document.addEventListener('scroll', (e) => {
            if (e.target && e.target.classList && e.target.dataset.infiniteSetup === "true") {
                const slider = e.target;
                const currentPos = Math.abs(slider.scrollLeft);
                const clientWidth = slider.clientWidth;
                const maxScroll = slider.scrollWidth - clientWidth;
                if (clientWidth === 0) return;

                const isRTL = document.documentElement.dir === 'rtl';
                let teleported = false;

                // Invisible Teleport if hitting boundaries
                if (currentPos <= 5) {
                    slider.style.scrollBehavior = 'auto';
                    slider.scrollLeft = isRTL ? -(maxScroll - clientWidth) : (maxScroll - clientWidth);
                    void slider.offsetWidth;
                    slider.style.scrollBehavior = 'smooth';
                    teleported = true;
                } else if (currentPos >= maxScroll - 5) {
                    slider.style.scrollBehavior = 'auto';
                    slider.scrollLeft = isRTL ? -clientWidth : clientWidth;
                    void slider.offsetWidth;
                    slider.style.scrollBehavior = 'smooth';
                    teleported = true;
                }

                // Sync the Red Dots perfectly with the scrolling image
                const dotsContainer = slider.nextElementSibling;
                if (dotsContainer && dotsContainer.id === 'modal-image-dots') {
                    const realCount = parseInt(slider.dataset.realCount);
                    const activePos = teleported ? Math.abs(slider.scrollLeft) : currentPos;
                    let activeIndex = Math.round(activePos / clientWidth) - 1; 
                    
                    if (activeIndex < 0) activeIndex = realCount - 1;
                    if (activeIndex >= realCount) activeIndex = 0;
                    
                    Array.from(dotsContainer.children).forEach((dot, k) => {
                        dot.className = `modal-dot w-2 h-2 rounded-full transition-all duration-300 ${k === activeIndex ? 'bg-red-500 scale-125' : 'bg-white/80 shadow-sm'}`;
                    });
                }
            }
        }, true); 

        // C. Smart Interaction Tracker (Stops auto-swiper when user touches the image)
        ['touchstart', 'touchmove', 'mousedown', 'wheel'].forEach(evt => {
            document.addEventListener(evt, (e) => {
                if (e.target.closest('.mini-img-slider') || e.target.closest('#modal-image-slider')) {
                    lastSliderInteraction = Date.now();
                }
            }, { passive: true });
        });

        // D. Auto-Swiper Engine
        setInterval(() => {
            if (Date.now() - lastSliderInteraction < 5000) return;
            const isRTL = document.documentElement.dir === 'rtl';
            document.querySelectorAll('.mini-img-slider, #modal-image-slider').forEach(slider => {
                if (slider.dataset.infiniteSetup === "true") {
                    const currentPos = Math.abs(slider.scrollLeft);
                    slider.scrollTo({ left: isRTL ? -(currentPos + slider.clientWidth) : (currentPos + slider.clientWidth), behavior: 'smooth' });
                }
            });
        }, 4000);

        // E. Manual Swipe Speed Boost
        let carouselSwipeStartX = 0;
        document.addEventListener('touchstart', (e) => {
            const slider = e.target.closest('.mini-img-slider, #modal-image-slider');
            if (slider && slider.children.length > 1) {
                carouselSwipeStartX = e.touches[0].clientX;
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const slider = e.target.closest('.mini-img-slider, #modal-image-slider');
            if (slider && slider.children.length > 1) {
                const maxScroll = slider.scrollWidth - slider.clientWidth;
                if (maxScroll <= 0) return; 
                
                const diff = carouselSwipeStartX - e.changedTouches[0].clientX; 
                
                if (Math.abs(diff) > 40) {
                    const isRTL = document.documentElement.dir === 'rtl';
                    const currentScroll = Math.abs(slider.scrollLeft);
                    
                    const isAtStart = currentScroll <= 5;
                    const isAtEnd = currentScroll >= maxScroll - 5;

                    const movingForward = isRTL ? diff < -40 : diff > 40;
                    const movingBackward = isRTL ? diff > 40 : diff < -40;

                    if (movingForward && isAtEnd) {
                        slider.scrollTo({ left: 0, behavior: 'smooth' });
                    } else if (movingBackward && isAtStart) {
                        slider.scrollTo({ left: isRTL ? -maxScroll : maxScroll, behavior: 'smooth' });
                    }
                }
            }
        }, { passive: true });

        // Start App
        window.onload = init;
    </script>
</body>
</html>
